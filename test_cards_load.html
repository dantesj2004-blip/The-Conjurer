<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Test Carga de Cartas</title>
</head>
<body>
    <h1>Test Carga de Cartas desde fetch_cards.php</h1>
    <button onclick="testLoad()">Probar Carga</button>
    <pre id="output"></pre>

    <script>
        async function testLoad() {
            const output = document.getElementById('output');
            output.textContent = 'Iniciando carga...\n';

            try {
                output.textContent += 'Haciendo fetch a fetch_cards.php\n';
                const response = await fetch('fetch_cards.php', { credentials: 'same-origin' });
                
                output.textContent += `Status: ${response.status} ${response.statusText}\n`;
                
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const raw = await response.text();
                output.textContent += `Raw response length: ${raw.length} bytes\n`;
                output.textContent += `First 500 chars: ${raw.substring(0, 500)}\n`;
                
                const data = JSON.parse(raw);
                output.textContent += `✅ JSON parsed successfully!\n`;
                output.textContent += `Total cards: ${Array.isArray(data) ? data.length : 'NO ES ARRAY'}\n`;
                
                if (Array.isArray(data) && data.length > 0) {
                    output.textContent += `\nFirst card:\n${JSON.stringify(data[0], null, 2)}\n`;
                }
            } catch (error) {
                output.textContent += `❌ ERROR: ${error.message}\n`;
            }
        }
    </script>
</body>
</html>
