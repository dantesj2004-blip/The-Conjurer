<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTICIAS - The Conjurer: Guerra de Mitos</title>
    <link rel="icon" type="image/png" href="Logo.png"> 
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="GaleriaCSS.css">
    <link rel="stylesheet" href="noticias.css">
    <script src="noticias.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="header-top-bar">
            <div class="auth-buttons">
                <a href="auth.html" class="btn-auth btn-register">REGISTRARSE</a>
                <a href="auth.html" class="btn-auth btn-login">ENTRAR</a>
                <a href="perfil.html" class="btn-auth btn-login hidden" id="userButton" style="display: none;">MI PERFIL</a>
            </div>
        </div>
        
        <div class="logo-area">
            <a href="index.html"><img src="Logo.png" alt="Logo The Conjurer" class="logo-main"></a>
        </div>
        
        <nav class="main-nav">
            <a href="index.html">INICIO</a>
            <a href="Galeria.html">GALERÍA</a>
            <a href="deckbuilder.html">DECKBUILDER</a>
            <a href="reglas.html">REGLAS</a>
            <a href="noticias.html" class="active">NOTICIAS</a>
        </nav>
    </header>
    
    <main class="news-content">
        <h1 class="news-title">Últimas Noticias</h1>
        
        <div class="news-grid">
            <!-- Cargado dinámicamente por noticias.js -->
        </div>

        <!-- Sección de Noticias Adicionales (Más Abajo) -->
        <section class="additional-news">
            <h2 class="section-subtitle">Más Noticias</h2>
            
            <div class="news-list">
                <!-- Cargado dinámicamente por noticias.js -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>THE CONJURER</h3>
                <p>GDM DeckBuilder Project © 2025</p>
            </div>
        </div>
    </footer>

    <script src="noticias.js"></script>
    <script>
        // Verificar sesión
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('/The-Conjurer/check_session.php', { credentials: 'same-origin' });
                const session = await response.json();
                if (session.logged_in) {
                    document.querySelector('.btn-register').style.display = 'none';
                    document.querySelector('.btn-login').style.display = 'none';
                    document.getElementById('userButton').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
